<template>
    <div class="burst-periods">
        <h4 class="slds-text-heading_small slds-var-m-bottom_small">Burst Periods</h4>

        <template for:each={rows} for:item="row">
            <div key={row.id} class="slds-var-m-bottom_small">
                <c-burst-period
                    burst={row.burst}
                    placeholder={row.placeholder}
                    plan-start={planStart}
                    plan-end={planEnd}
                    issue={row.issue}
                    show-remove={row.showRemove}
                    disabled={row.disabled}
                    onburstchange={handleBurstChange}
                    onburstremove={handleBurstRemove}>
                </c-burst-period>
            </div>
        </template>

        <template lwc:if={hasBursts}>
            <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">{hintText}</p>
        </template>

        <button type="button" class="slds-button slds-button_neutral" disabled={disabled} onclick={handleAddBurst}>+ Add Burst Period</button>
    </div>
</template>
