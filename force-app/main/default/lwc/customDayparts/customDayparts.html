<template>
    <div class="custom-dayparts">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-m-bottom_small">
            <h4 class="slds-text-heading_small">Custom Dayparts</h4>
            <button type="button" class="slds-button slds-button_neutral" disabled={updateDefaultsDisabled} onclick={handleUpdateDefaults}>Update Defaults</button>
        </div>

        <template for:each={rows} for:item="row">
            <div key={row.id} class="slds-var-m-bottom_small">
                <c-custom-daypart
                    daypart={row.daypart}
                    placeholder={row.placeholder}
                    issue={row.issue}
                    disabled={row.disabled}
                    oncustomdaypartchange={handleDaypartChange}
                    oncustomdaypartremove={handleDaypartRemove}>
                </c-custom-daypart>
            </div>
        </template>

        <button type="button" class="slds-button slds-button_neutral" disabled={disabled} onclick={handleAdd}>+ Add Custom Dayparts</button>
    </div>
</template>
