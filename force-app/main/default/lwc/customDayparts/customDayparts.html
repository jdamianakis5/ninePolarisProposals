<template>
    <div class="custom-dayparts">
        <template for:each={rows} for:item="row">
            <div key={row.id} class="slds-grid slds-wrap slds-gutters_x-small slds-var-m-bottom_x-small slds-grid_vertical-align-end">
                <div class="slds-col slds-grow-none daypart-name">
                    <lightning-input
                        label="Name"
                        variant="label-hidden"
                        placeholder={row.placeholder}
                        value={row.name}
                        data-id={row.id}
                        disabled={row.disabled}
                        onchange={handleNameChange}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-grow-none">
                    <lightning-input
                        type="time"
                        label="Start time"
                        variant="label-hidden"
                        value={row.start}
                        data-id={row.id}
                        disabled={row.disabled}
                        onchange={handleStartChange}>
                    </lightning-input>
                </div>
                <span class="slds-var-p-horizontal_x-small slds-text-color_weak">to</span>
                <div class="slds-col slds-grow-none">
                    <lightning-input
                        type="time"
                        label="End time"
                        variant="label-hidden"
                        value={row.end}
                        data-id={row.id}
                        disabled={row.disabled}
                        onchange={handleEndChange}>
                    </lightning-input>
                </div>
                <div class={row.summaryClass}>{row.summary}</div>
                <div class="slds-col slds-grow-none">
                    <button
                        type="button"
                        class="slds-button slds-button_text-destructive"
                        data-id={row.id}
                        disabled={row.disabled}
                        onclick={handleRemove}>Remove</button>
                </div>
            </div>
        </template>

        <button
            type="button"
            class="slds-button slds-button_neutral"
            disabled={disabled}
            onclick={handleAdd}>+ Custom Time Period</button>
    </div>
</template>
