<template>
    <div class="top-tail-durations">
        <lightning-input
            type="toggle"
            label="Enable Top/Tail durations"
            checked={topTail}
            disabled={disabled}
            onchange={handleToggle}>
        </lightning-input>
        <p class="slds-text-body_small slds-text-color_weak slds-var-m-bottom_small">Fixed-only campaigns</p>

        <template lwc:if={topTail}>
            <div class="slds-var-m-bottom_small">
                <template for:each={rows} for:item="row">
                    <div key={row.id} class="slds-box slds-theme_shade slds-var-m-bottom_small tt-set">
                        <div class="slds-grid slds-wrap slds-gutters_small slds-grid_vertical-align-end">
                            <div class="slds-col slds-grow-none">
                                <div class={row.fieldWrapClass}>
                                    <label class="slds-form-element__label">
                                        <abbr class="slds-required" title="required">*</abbr>Top duration
                                    </label>
                                    <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
                                        <input
                                            type="text"
                                            inputmode="numeric"
                                            class="slds-input tt-input"
                                            placeholder="0"
                                            value={row.top}
                                            data-id={row.id}
                                            disabled={row.disabled}
                                            onchange={handleTopChange}>
                                        <span class="slds-icon_container tt-input__suffix">sec</span>
                                    </div>
                                </div>
                            </div>

                            <template lwc:if={row.hasMid}>
                                <div class="slds-col slds-grow-none">
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">Middle duration</label>
                                        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
                                            <input
                                                type="text"
                                                inputmode="numeric"
                                                class="slds-input tt-input"
                                                placeholder="0"
                                                value={row.mid}
                                                data-id={row.id}
                                                disabled={row.disabled}
                                                onchange={handleMidChange}>
                                            <span class="slds-icon_container tt-input__suffix">sec</span>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <div class="slds-col slds-grow-none">
                                <div class={row.fieldWrapClass}>
                                    <label class="slds-form-element__label">
                                        <abbr class="slds-required" title="required">*</abbr>Tail duration
                                    </label>
                                    <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
                                        <input
                                            type="text"
                                            inputmode="numeric"
                                            class="slds-input tt-input"
                                            placeholder="0"
                                            value={row.tail}
                                            data-id={row.id}
                                            disabled={row.disabled}
                                            onchange={handleTailChange}>
                                        <span class="slds-icon_container tt-input__suffix">sec</span>
                                    </div>
                                </div>
                            </div>

                            <div class="slds-col slds-grow slds-grid slds-grid_vertical-align-center tt-actions">
                                <button
                                    type="button"
                                    class="slds-button slds-button_text-brand"
                                    data-id={row.id}
                                    disabled={row.disabled}
                                    onclick={handleMidToggle}>{row.midLabel}</button>
                                <template lwc:if={row.showRemove}>
                                    <button
                                        type="button"
                                        class="slds-button slds-button_text-brand tt-remove"
                                        data-id={row.id}
                                        disabled={row.disabled}
                                        onclick={handleRemoveSet}>Remove set</button>
                                </template>
                            </div>
                        </div>

                        <template lwc:if={row.showError}>
                            <p class="slds-text-body_small slds-text-color_error slds-var-m-top_x-small">{row.errorText}</p>
                        </template>
                        <template lwc:if={row.showOk}>
                            <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_x-small">{row.okText}</p>
                        </template>
                    </div>
                </template>
            </div>

            <button
                type="button"
                class="slds-button slds-button_neutral"
                disabled={disabled}
                onclick={handleAddSet}>+ Add top/tail set</button>
        </template>
    </div>
</template>
