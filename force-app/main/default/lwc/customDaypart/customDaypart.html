<template>
    <div class="custom-daypart">
        <div class="slds-grid slds-wrap slds-gutters_x-small slds-grid_vertical-align-end">
            <div class="slds-col slds-grow-none custom-daypart__name">
                <lightning-input
                    label="Name"
                    variant="label-hidden"
                    placeholder={placeholder}
                    value={daypart.name}
                    disabled={disabled}
                    onchange={handleNameChange}>
                </lightning-input>
            </div>
            <div class="slds-col slds-grow-none">
                <lightning-input
                    type="time"
                    label="Start time"
                    variant="label-hidden"
                    value={daypart.start}
                    disabled={disabled}
                    onchange={handleStartChange}>
                </lightning-input>
            </div>
            <span class="slds-var-p-horizontal_x-small slds-text-color_weak">to</span>
            <div class="slds-col slds-grow-none">
                <lightning-input
                    type="time"
                    label="End time"
                    variant="label-hidden"
                    value={daypart.end}
                    disabled={disabled}
                    onchange={handleEndChange}>
                </lightning-input>
            </div>
            <div class={summaryClass}>{summary}</div>
            <div class="slds-col slds-grow-none">
                <button type="button" class="slds-button slds-button_text-destructive" disabled={disabled} onclick={handleRemove}>Remove</button>
            </div>
        </div>
        <template lwc:if={hasIssue}>
            <p class="slds-text-body_small slds-text-color_error slds-var-m-top_xx-small">{issue}</p>
        </template>
    </div>
</template>
